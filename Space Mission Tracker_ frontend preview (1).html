<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Mission Tracker: preview</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F4F9FF;--side:#E3F0FF;--card:#fff;--text:#0B2545;--mute:#5A7394;--line:#CFE3FA;--blue:#1E6FD9;--red:#FFD9D9;--head:#EEF5FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2E;--side:#10253F;--card:#12294A;--text:#E6F0FF;--mute:#8FA9CC;--line:#23466F;--red:#5A2630;--head:#16315A}}
:root[data-theme="dark"]{--bg:#0B1A2E;--side:#10253F;--card:#12294A;--text:#E6F0FF;--mute:#8FA9CC;--line:#23466F;--red:#5A2630;--head:#16315A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
aside{width:230px;background:var(--side);padding:24px 16px;flex-shrink:0}
aside h3{margin:0 0 12px;font-size:.95rem;color:var(--mute);font-weight:600}
aside label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer}
aside label:hover{background:rgba(30,111,217,.12)}
aside input{accent-color:var(--blue)}
main{flex:1;padding:24px 32px;min-width:0}
.hero{background:linear-gradient(90deg,#1E6FD9,#5BB4F0);padding:22px 28px;border-radius:14px;margin-bottom:20px}
.hero h1{margin:0;color:#fff;font-size:2rem}.hero p{margin:4px 0 0;color:#EAF4FF}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.m span{color:var(--mute);font-size:.9rem}.m b{display:block;font-size:2rem;font-weight:600}
h2{font-size:1.3rem;margin:8px 0 10px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{background:var(--head);text-align:left;padding:9px 14px;color:var(--mute);font-weight:600}
td{padding:9px 14px;border-top:1px solid var(--line);white-space:nowrap}
tr.hot td{background:var(--red)}
.cap{color:var(--mute);font-size:.88rem;margin-top:8px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar i{display:block;height:22px;background:var(--blue);border-radius:4px}
.bar span:first-child{width:110px}
select,input[type=date],button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button{background:var(--blue);color:#fff;border:0;cursor:pointer}
.ok{background:#DCEEFF;color:#0B2545;padding:10px 14px;border-radius:8px;margin:12px 0}
.tag{font-size:.8rem;color:var(--mute);margin-bottom:14px}
@media(max-width:700px){.app{flex-direction:column}aside{width:100%}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<aside>
<h3>Go to</h3>
<div id="nav"></div>
</aside>
<main>
<div class="hero"><h1>🛰️ Space Mission &amp; Satellite Tracker</h1><p>Track satellites, launch vehicles and mission end dates</p></div>
<p class="tag">Preview mock-up: the real app is the Streamlit page, same colors and layout.</p>
<div id="view"></div>
</main>
</div>
<script>
const SAT=[[1,"RISAT-2B","ISRO","PSLV","2019-05-22","active"],[2,"Cartosat-3","ISRO","PSLV","2019-11-27","active"],[3,"GSAT-30","ISRO","Ariane 5","2020-01-17","active"],[4,"Oceansat-3","ISRO","PSLV","2022-11-26","active"],[5,"Sentinel-2A","ESA","Vega","2015-06-23","active"],[6,"Aeolus","ESA","Vega","2018-08-22","inactive"],[7,"Sentinel-6","ESA","Falcon 9","2020-11-21","active"],[8,"SWOT","NASA","Falcon 9","2022-12-16","active"],[9,"GOSAT","JAXA","H-IIA","2009-01-23","active"]];
const ORB={"RISAT-2B":[556,"LEO"],"Cartosat-3":[509,"LEO"],"GSAT-30":[35786,"GEO"],"Oceansat-3":[742,"LEO"],"Sentinel-2A":[786,"LEO"],"Aeolus":[320,"LEO"],"Sentinel-6":[1336,"LEO"],"SWOT":[890,"LEO"],"GOSAT":[666,"LEO"]};
const EOL=[["GOSAT","JAXA","2026-11-06",10],["Sentinel-2A","ESA","2026-11-16",20],["RISAT-2B","ISRO","2026-12-06",40],["Cartosat-3","ISRO","2027-01-10",75]];
const VEH=[["PSLV",3],["Falcon 9",2],["Vega",2],["Ariane 5",1],["H-IIA",1],["GSLV Mk III",0]];
const PAGES=["Dashboard","Satellite Registry","End-of-Life Alerts","Vehicle Utilization","Trigger Demo"];
const tbl=(h,rows,hot)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr class="${hot&&hot(r)?"hot":""}">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
function show(p){
 const v=document.getElementById("view");
 if(p=="Dashboard"){
  v.innerHTML=`<div class="metrics"><div class="m"><span>Total satellites</span><b>9</b></div><div class="m"><span>Active</span><b>8</b></div><div class="m"><span>Inactive / debris</span><b>1</b></div><div class="m"><span>Ending in 90 days</span><b>4</b></div></div><h2>Orbit details</h2>`+tbl(["satellite","altitude_km","orbit_type"],Object.entries(ORB).map(([k,o])=>[k,o[0],o[1]]));
 }else if(p=="Satellite Registry"){
  v.innerHTML=`<p><label>Agency<br><select id="ag"><option>All</option><option>ISRO</option><option>NASA</option><option>ESA</option><option>JAXA</option></select></label></p><div id="t"></div>`;
  const draw=()=>{const a=document.getElementById("ag").value;document.getElementById("t").innerHTML=tbl(["satellite_id","name","agency","vehicle","launch_date","status"],SAT.filter(r=>a=="All"||r[2]==a))};
  document.getElementById("ag").onchange=draw;draw();
 }else if(p=="End-of-Life Alerts"){
  v.innerHTML=`<h2>Active satellites whose mission ends within 90 days</h2>`+tbl(["satellite","agency","expected_end_date","days_remaining"],EOL,r=>r[3]<30)+`<p class="cap">Red rows have fewer than 30 days left.</p>`;
 }else if(p=="Vehicle Utilization"){
  v.innerHTML=`<h2>Satellites per launch vehicle</h2>`+VEH.map(r=>`<div class="bar"><span>${r[0]}</span><i style="width:${r[1]*90}px"></i><span>${r[1]}</span></div>`).join("");
 }else{
  v.innerHTML=`<h2>Change a mission end date and watch the trigger fire</h2><p><select id="s">${SAT.map(r=>`<option>${r[1]}</option>`).join("")}</select> <input type="date" id="d"> <button id="b">Update mission</button></p><div id="o"></div>`;
  document.getElementById("b").onclick=()=>{const n=document.getElementById("s").value,d=document.getElementById("d").value;const past=d&&new Date(d)<new Date();document.getElementById("o").innerHTML=`<div class="ok">Mission updated. The trigger checked the date and updated the satellite status.</div>`+tbl(["name","status"],[[n,past?"inactive":"active"]])};
 }
}
const nav=document.getElementById("nav");
PAGES.forEach((p,i)=>{nav.insertAdjacentHTML("beforeend",`<label><input type="radio" name="pg" ${i?"":"checked"}>${p}</label>`);nav.lastChild.onclick=()=>show(p)});
show("Dashboard");
</script>
</body>
</html>
