<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Console: preview</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F4F9FF;--card:#fff;--text:#0B2545;--mute:#5A7394;--line:#CFE3FA;--blue:#1E6FD9;--head:#EEF5FF;--code:#0F2A4D;--codetext:#DDEBFF;--err:#FFE3E3;--errt:#8A1F1F;--ok:#DCEEFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2E;--card:#12294A;--text:#E6F0FF;--mute:#8FA9CC;--line:#23466F;--head:#16315A;--code:#071426;--err:#4A2028;--errt:#FFB4B4;--ok:#16315A}}
:root[data-theme="dark"]{--bg:#0B1A2E;--card:#12294A;--text:#E6F0FF;--mute:#8FA9CC;--line:#23466F;--head:#16315A;--code:#071426;--err:#4A2028;--errt:#FFB4B4;--ok:#16315A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 20px}
.hero{background:linear-gradient(90deg,#1E6FD9,#5BB4F0);padding:20px 26px;border-radius:14px;margin-bottom:18px}
.hero h1{margin:0;color:#fff;font-size:1.8rem}.hero p{margin:4px 0 0;color:#EAF4FF}
h2{font-size:1.15rem;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem}
.chip:hover{border-color:var(--blue)}
textarea{width:100%;height:150px;background:var(--code);color:var(--codetext);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.run{margin-top:10px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 22px;font:inherit;cursor:pointer}
.msg{padding:10px 14px;border-radius:8px;margin:14px 0 8px;font-size:.95rem}
.msg.ok{background:var(--ok)}.msg.err{background:var(--err);color:var(--errt);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{background:var(--head);text-align:left;padding:9px 14px;color:var(--mute);font-weight:600}
td{padding:9px 14px;border-top:1px solid var(--line);white-space:nowrap}
.tag{color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<main>
<div class="hero"><h1>🛰️ SQL Console</h1><p>Type a query, press Run, see the result table</p></div>
<p class="tag">Preview mock-up: it only runs the sample queries below. The real page would run any query on your MySQL database.</p>
<h2>Sample queries</h2>
<div class="chips" id="chips"></div>
<h2>Your query</h2>
<textarea id="q" spellcheck="false"></textarea>
<button class="run" id="run">Run query</button>
<div id="out"></div>
</main>
<script>
const Q=[
{n:"Satellite registry",sql:"SELECT s.name, a.name AS agency, lv.name AS vehicle, s.launch_date, s.status\nFROM Satellite s\nJOIN Agency a ON s.agency_id = a.agency_id\nJOIN LaunchVehicle lv ON s.vehicle_id = lv.vehicle_id;",
 h:["name","agency","vehicle","launch_date","status"],r:[["RISAT-2B","ISRO","PSLV","2019-05-22","active"],["Cartosat-3","ISRO","PSLV","2019-11-27","active"],["GSAT-30","ISRO","Ariane 5","2020-01-17","active"],["Oceansat-3","ISRO","PSLV","2022-11-26","active"],["Sentinel-2A","ESA","Vega","2015-06-23","active"],["Aeolus","ESA","Vega","2018-08-22","inactive"],["Sentinel-6","ESA","Falcon 9","2020-11-21","active"],["SWOT","NASA","Falcon 9","2022-12-16","active"],["GOSAT","JAXA","H-IIA","2009-01-23","active"]]},
{n:"Vehicle utilization",sql:"SELECT lv.name AS vehicle, COUNT(s.satellite_id) AS satellites_launched\nFROM LaunchVehicle lv\nLEFT JOIN Satellite s ON lv.vehicle_id = s.vehicle_id\nGROUP BY lv.name\nORDER BY satellites_launched DESC;",
 h:["vehicle","satellites_launched"],r:[["PSLV",3],["Falcon 9",2],["Vega",2],["Ariane 5",1],["H-IIA",1],["GSLV Mk III",0]]},
{n:"End-of-life view",sql:"SELECT * FROM end_of_life_dashboard\nORDER BY days_remaining;",
 h:["satellite_id","satellite","agency","expected_end_date","days_remaining"],r:[[9,"GOSAT","JAXA","2026-11-06",10],[5,"Sentinel-2A","ESA","2026-11-16",20],[1,"RISAT-2B","ISRO","2026-12-06",40],[2,"Cartosat-3","ISRO","2027-01-10",75]]},
{n:"Satellites per agency",sql:"SELECT a.name, COUNT(*) AS total\nFROM Agency a\nJOIN Satellite s ON a.agency_id = s.agency_id\nGROUP BY a.name;",
 h:["name","total"],r:[["ISRO",4],["ESA",3],["NASA",1],["JAXA",1]]},
{n:"Active GEO satellites",sql:"SELECT s.name\nFROM Satellite s\nJOIN OrbitDetail o ON s.satellite_id = o.satellite_id\nWHERE o.orbit_type = 'GEO' AND s.status = 'active';",
 h:["name"],r:[["GSAT-30"]]},
{n:"Launched after 2019",sql:"SELECT name, launch_date FROM Satellite\nWHERE launch_date > '2019-12-31';",
 h:["name","launch_date"],r:[["GSAT-30","2020-01-17"],["Oceansat-3","2022-11-26"],["Sentinel-6","2020-11-21"],["SWOT","2022-12-16"]]},
{n:"Try a wrong table",sql:"SELECT * FROM Satelite;",err:"Satelite"}
];
const norm=s=>s.toLowerCase().replace(/\s+/g," ").replace(/;$/,"").trim();
const TABLES=["agency","launchvehicle","satellite","orbitdetail","mission","end_of_life_dashboard"];
const q=document.getElementById("q"),out=document.getElementById("out");
const tbl=(h,rows)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
function run(){
 const t=norm(q.value);
 if(!t){out.innerHTML=`<div class="msg err">Enter a query first.</div>`;return}
 const hit=Q.find(x=>!x.err&&norm(x.sql)==t);
 if(hit){out.innerHTML=`<div class="msg ok">${hit.r.length} row(s) returned in 0.002 sec</div>`+tbl(hit.h,hit.r);return}
 const m=t.match(/\bfrom\s+(\w+)/);
 if(m&&!TABLES.includes(m[1])){out.innerHTML=`<div class="msg err">ERROR 1146 (42S02): Table 'space_tracker.${m[1]}' doesn't exist</div><p class="tag">Check the table name spelling. Tables: Agency, LaunchVehicle, Satellite, OrbitDetail, Mission.</p>`;return}
 out.innerHTML=`<div class="msg ok">This preview only runs the sample queries. Pick one from the chips above.</div>`;
}
const chips=document.getElementById("chips");
Q.forEach(x=>{const b=document.createElement("button");b.className="chip";b.textContent=x.n;b.onclick=()=>{q.value=x.sql;out.innerHTML=""};chips.appendChild(b)});
document.getElementById("run").onclick=run;
q.value=Q[0].sql;run();
</script>
</body>
</html>
